project:
  random_seed: 42
  output_dir: "data/results"

audio:
  librispeech_dir: "data/raw/librispeech_test_clean/LibriSpeech/test-clean"
  sample_speakers: 30
  clips_per_speaker: 5
  min_duration_sec: 8
  max_duration_sec: 20
  target_sample_rate: 16000
  target_channels: 1

voice_deid:
  output_dir: "data/processed/audio_voice_deidentified"

speaker_embedding:
  model_source: "speechbrain/spkrec-ecapa-voxceleb"

semantic_generation:
  n_transcripts: 150
  model: "openai/gpt-5.2"
  timeout_sec: 180
  max_tokens: 2000
  max_attempts_per_record: 4
  parallel_requests: 4
  output_file: "data/raw/synthetic_generated/transcripts_raw.jsonl"

metadata_generation:
  n_records: 150
  output_file: "data/raw/synthetic_generated/metadata_raw.jsonl"

metadata_sanitization:
  target_sample_rate: 16000
  target_channels: "mono"

qwen_semantic_deid:
  model: "Qwen/Qwen3.6-27B"
  parallel_requests: 6
  timeout_sec: 120
  max_tokens: 2000
  max_attempts: 2
